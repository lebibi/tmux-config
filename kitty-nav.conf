# kitty integration, needs tmux 3.3+ and kitty's allow_remote_control

set -g set-clipboard on
# pane-focus-in and client-focus-in need it
set -g focus-events on
set -as terminal-features ',xterm-kitty*:clipboard:RGB:usstyle:strikethrough:overline:sync:extkeys'
%if "#{>=:#{version},3.4}"
set -as terminal-features ',xterm-kitty*:hyperlinks'
%endif
%if "#{>=:#{version},3.5}"
set -s extended-keys-format csi-u
%endif
set -g set-titles on
set -g set-titles-string '#h: tmux #S:#W'

# kitty forwards ctrl+a and ctrl+h/j/k/l into ssh while IN_TMUX is set
set-hook -g client-attached[42]        'run-shell -b "~/.tmux/bin/kitty-nav var #{q:client_tty} IN_TMUX 1"'
set-hook -g client-session-changed[42] 'run-shell -b "~/.tmux/bin/kitty-nav var #{q:client_tty} IN_TMUX 1"'
set-hook -g client-focus-in[42]        'run-shell -b "~/.tmux/bin/kitty-nav var #{q:client_tty} IN_TMUX 1"'
set-hook -g client-detached[42]        'run-shell -b "~/.tmux/bin/kitty-nav var #{q:client_tty} IN_TMUX"'

# Report the active pane's directory for kitty's launch --cwd=current
#
# kitty's shell integration retitles the pane at every prompt, which catches cd.
set-hook -g pane-focus-in[42]      'run-shell -b "~/.tmux/bin/kitty-nav cwd #{q:client_tty} #{q:pane_current_path}"'
set-hook -g pane-title-changed[42] 'if -F "#{pane_active}" { run-shell -b "~/.tmux/bin/kitty-nav cwd #{q:client_tty} #{q:pane_current_path}" }'

# At the outer tmux edge, kitty moves to its neighboring window
bind-key -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { if -F '#{pane_at_left}'   { run-shell -b '~/.tmux/bin/kitty-nav move #{q:client_tty} left' }  { select-pane -L } }
bind-key -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { if -F '#{pane_at_bottom}' { run-shell -b '~/.tmux/bin/kitty-nav move #{q:client_tty} down' }  { select-pane -D } }
bind-key -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { if -F '#{pane_at_top}'    { run-shell -b '~/.tmux/bin/kitty-nav move #{q:client_tty} up' }    { select-pane -U } }
bind-key -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { if -F '#{pane_at_right}'  { run-shell -b '~/.tmux/bin/kitty-nav move #{q:client_tty} right' } { select-pane -R } }

bind-key -T copy-mode-vi C-h if -F '#{pane_at_left}'   { run-shell -b '~/.tmux/bin/kitty-nav move #{q:client_tty} left' }  { select-pane -L }
bind-key -T copy-mode-vi C-j if -F '#{pane_at_bottom}' { run-shell -b '~/.tmux/bin/kitty-nav move #{q:client_tty} down' }  { select-pane -D }
bind-key -T copy-mode-vi C-k if -F '#{pane_at_top}'    { run-shell -b '~/.tmux/bin/kitty-nav move #{q:client_tty} up' }    { select-pane -U }
bind-key -T copy-mode-vi C-l if -F '#{pane_at_right}'  { run-shell -b '~/.tmux/bin/kitty-nav move #{q:client_tty} right' } { select-pane -R }

# Zoom and split the kitty window
bind-key Z run-shell -b '~/.tmux/bin/kitty-nav action #{q:client_tty} toggle_layout stack'
bind-key V run-shell -b '~/.tmux/bin/kitty-nav cwd #{q:client_tty} #{q:pane_current_path}; ~/.tmux/bin/kitty-nav action #{q:client_tty} launch --location=vsplit --cwd=current'
bind-key _ run-shell -b '~/.tmux/bin/kitty-nav cwd #{q:client_tty} #{q:pane_current_path}; ~/.tmux/bin/kitty-nav action #{q:client_tty} launch --location=hsplit --cwd=current'
